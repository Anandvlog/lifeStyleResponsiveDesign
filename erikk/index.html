<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erikk-design</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
     <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <header>
        <nav>
            <div class="top_heading">
                <img src="https://cdn.prod.website-files.com/63fd93c920392238faa118c4/63fec9eeb8692c4a95dd4ec0_logo.svg" alt="demo_alt" />
                <i class="ri-list-unordered"></i>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero_section">
            <div class="container">
                <div class="fashion_section">
                    <img src="https://cdn.prod.website-files.com/63fd93c920392238faa118c4/63fed275667d13010afac1ac_heading-fashionwerk.svg"  alt="section_main"/>
                </div>
                <div class="second_text">
                    <h3>Branding Agency</h3>
                    <h3>From Berlin</h3>
                </div>
                <div class="universal_wrapper">
                    <div class="universial_text">
                        <h2>Unleash­ing Your Brand’s Potential</h2>
                        <p>Comprehensive branding solutions that help fashion, lifestyle, and luxury brands connect with their target audience.</p>
                    </div>
                    <div class="universal_img">
                        <img src="https://assets-global.website-files.com/63fd93c920392238faa118c4/63fed72aa75a04d4f083eb4a_home-hero-p-1600.webp" alt="demo_img" />
                    </div>
                </div>
            </div>
        </section>
    </main>



    <script src="script.js"></script>
    
</body>
</html>
